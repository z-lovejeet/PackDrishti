name: BiteIQ CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Static Code Analysis (Oxlint)
        run: npm run lint

      - name: Build React Application
        run: npm run build

  backend-ci:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DEBUG: "false"
      PYTHONPATH: .
      JWT_SECRET_KEY: test_secret_key_for_ci_pipeline_only_32bytes_minimum
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m compileall backend/src/ ai/src/

      - name: Verify Zero-Emoji Policy Compliance
        run: |
          python -c "
          import re, glob
          emoji_pattern = re.compile('[\U00010000-\U0010ffff]|[\u2600-\u27bf]|[\u2300-\u23ff]|[\u2b50-\u2b55]')
          files = glob.glob('backend/src/**/*.py', recursive=True) + glob.glob('ai/src/**/*.py', recursive=True)
          violating_files = [f for f in files if emoji_pattern.findall(open(f, encoding='utf-8', errors='ignore').read())]
          if violating_files:
              print('Zero-Emoji Violation in files:', violating_files)
              exit(1)
          print('Zero-Emoji compliance verified: 0 emojis found.')
          "

      - name: Execute Automated Pytest Matrix
        run: |
          python -m pytest backend/tests/ -v

  docker-ci:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: biteiq-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: biteiq-frontend:test
