version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  metroscan-db:
    image: pgvector/pgvector:pg16
    container_name: metroscan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metroscan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscan_pass}
      POSTGRES_DB: ${POSTGRES_DB:-metroscan_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - metroscan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-metroscan_user} -d $${POSTGRES_DB:-metroscan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - metroscan-network

  # ----------------------------------------------------------------------------
  # Redis 7 Cache & Message Broker
  # ----------------------------------------------------------------------------
  metroscan-redis:
    image: redis:7-alpine
    container_name: metroscan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - metroscan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - metroscan-network

  # ----------------------------------------------------------------------------
  # MetroScan FastAPI Backend Application
  # ----------------------------------------------------------------------------
  metroscan-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metroscan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://metroscan_user:metroscan_pass@metroscan-db:5432/metroscan_db
      REDIS_URL: redis://metroscan-redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4a2e8c1f9b3d7a6e508192c73e4b5a6f80192837465019283746501928374650}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      metroscan-db:
        condition: service_healthy
      metroscan-redis:
        condition: service_healthy
    networks:
      - metroscan-network

  # ----------------------------------------------------------------------------
  # Database GUI Administration (Adminer)
  # Accessible via http://localhost:8080
  # ----------------------------------------------------------------------------
  metroscan-adminer:
    image: adminer:latest
    container_name: metroscan-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: metroscan-db
    depends_on:
      metroscan-db:
        condition: service_healthy
    networks:
      - metroscan-network

volumes:
  metroscan_postgres_data:
    driver: local
  metroscan_redis_data:
    driver: local

networks:
  metroscan-network:
    driver: bridge
