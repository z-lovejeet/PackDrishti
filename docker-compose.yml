version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  biteiq-db:
    image: pgvector/pgvector:pg16
    container_name: biteiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biteiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biteiq_pass}
      POSTGRES_DB: ${POSTGRES_DB:-biteiq_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - biteiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-biteiq_user} -d $${POSTGRES_DB:-biteiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - biteiq-network

  # ----------------------------------------------------------------------------
  # BiteIQ FastAPI Backend Application
  # ----------------------------------------------------------------------------
  biteiq-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biteiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://biteiq_user:biteiq_pass@biteiq-db:5432/biteiq_db}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4a2e8c1f9b3d7a6e508192c73e4b5a6f80192837465019283746501928374650}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
    depends_on:
      biteiq-db:
        condition: service_healthy
    networks:
      - biteiq-network

  # ----------------------------------------------------------------------------
  # BiteIQ React Frontend Application (Nginx SPA)
  # Accessible via http://localhost:3000
  # ----------------------------------------------------------------------------
  biteiq-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: biteiq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - biteiq-backend
    networks:
      - biteiq-network

  # ----------------------------------------------------------------------------
  # Database GUI Administration (Adminer)
  # Accessible via http://localhost:8080
  # ----------------------------------------------------------------------------
  biteiq-adminer:
    image: adminer:latest
    container_name: biteiq-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: biteiq-db
    depends_on:
      biteiq-db:
        condition: service_healthy
    networks:
      - biteiq-network

volumes:
  biteiq_postgres_data:
    driver: local

networks:
  biteiq-network:
    driver: bridge
