version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  packdrashiti-db:
    image: pgvector/pgvector:pg16
    container_name: packdrashiti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-packdrashiti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-packdrashiti_pass}
      POSTGRES_DB: ${POSTGRES_DB:-packdrashiti_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - packdrashiti_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-packdrashiti_user} -d $${POSTGRES_DB:-packdrashiti_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - packdrashiti-network

  # ----------------------------------------------------------------------------
  # PackDrashiti FastAPI Backend Application
  # ----------------------------------------------------------------------------
  packdrashiti-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: packdrashiti-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://packdrashiti_user:packdrashiti_pass@packdrashiti-db:5432/packdrashiti_db}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4a2e8c1f9b3d7a6e508192c73e4b5a6f80192837465019283746501928374650}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      packdrashiti-db:
        condition: service_healthy
    networks:
      - packdrashiti-network

  # ----------------------------------------------------------------------------
  # Database GUI Administration (Adminer)
  # Accessible via http://localhost:8080
  # ----------------------------------------------------------------------------
  packdrashiti-adminer:
    image: adminer:latest
    container_name: packdrashiti-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: packdrashiti-db
    depends_on:
      packdrashiti-db:
        condition: service_healthy
    networks:
      - packdrashiti-network

volumes:
  packdrashiti_postgres_data:
    driver: local

networks:
  packdrashiti-network:
    driver: bridge
